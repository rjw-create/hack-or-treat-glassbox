[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox"
version = "0.1.0"
description = "Watch which sparse-autoencoder features fire in an open-weight model, and steer them."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "torch==2.15.0",
    "transformers==5.22.1",
    "sae-lens==6.54.12",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
ui = ["gradio==6.31.0"]

[tool.setuptools]
packages = ["glassbox"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
