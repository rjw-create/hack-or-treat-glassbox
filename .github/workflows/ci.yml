name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Unit tests use FakeGlassbox; this makes any accidental model or SAE download fail fast.
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The CPU-only torch wheel is far smaller than the default CUDA build, which these tests don't need.
          pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,ui]"

      # Unit tests only. The real-model smoke run (python -m glassbox.smoke) stays local.
      - name: Run unit tests
        run: python -m pytest -q
